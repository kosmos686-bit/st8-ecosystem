<style>
:root { --accent: #d4af37; --bg: #0a0a0a; --surface: #141414; --surface2: #1e1e1e; --surface3: #252525; --border: rgba(255,255,255,0.08); --text: #f0f0f0; --text-muted: rgba(240,240,240,0.45); --text-dim: rgba(240,240,240,0.2); --radius: 12px; --font: 'Inter', sans-serif; --header-h: 60px; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
#onboarding { min-height: 100vh; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
.ob-logo { font-size: 2rem; font-weight: 900; letter-spacing: -.03em; margin-bottom: .25rem; }

.vert-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }

.btn-accent { background: var(--accent); color: #0a0a0a; }

.btn-outline:hover { background: rgba(212,175,55,.1); }
.btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

.ob-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; gap: 1rem; }

header { position: sticky; top: 0; z-index: 100; background: rgba(10,10,10,.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); height: var(--header-h); display: flex; align-items: center; padding: 0 1rem; gap: .75rem; }

.msg.user .msg-avatar { background: var(--surface3); }

.msg-actions { display: flex; gap: .35rem; margin-top: .35rem; flex-wrap: wrap; }
.ma-btn { padding: .22rem .55rem; border-radius: 6px; font-size: .67rem; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); transition: all .2s; }
.ma-btn:hover { border-color: var(--accent); color: var(--accent); }
.thinking { font-size: .78rem; color: var(--text-dim); font-style: italic; padding: .5rem .85rem; }
.chat-input-area { display: flex; gap: .45rem; }
.chat-input-area textarea { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .6rem .8rem; color: var(--text); font-size: .85rem; resize: none; outline: none; transition: border-color .2s; min-height: 46px; max-height: 110px; line-height: 1.4; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }

.badge-green { background: rgba(34,197,94,.13); color: #86efac; }
.badge-yellow { background: rgba(234,179,8,.13); color: #fde047; }

.card-grid { display: grid; grid-template-columns: 1fr; gap: .9rem; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; }

.roi-result { background: var(--surface); border: 1px solid rgba(212,175,55,.22); border-radius: 14px; padding: 1.4rem; }

.modal-bg.hidden { display: none; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.4rem; width: 100%; max-width: 580px; margin: auto; }
.modal-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.1rem; }

.close-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; width: 28px; height: 28px; cursor: pointer; font-size: .9rem; color: var(--text-muted); line-height: 1; transition: all .2s; }

.mem-list { display: flex; flex-direction: column; gap: .3rem; max-height: 110px; overflow-y: auto; margin-bottom: .4rem; }

.mem-section { margin-top: .9rem; }

.divider { height: 1px; background: var(--border); margin: 1.1rem 0; }
.chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; margin-bottom: 1.1rem; }
.chart-title { font-size: .82rem; font-weight: 600; margin-bottom: .75rem; }
.chart-toggle { display: flex; gap: .3rem; margin-bottom: .65rem; }
.ct-btn { padding: .28rem .65rem; border-radius: 6px; font-size: .7rem; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); transition: all .2s; }
.ct-btn.active { background: rgba(212,175,55,.12); border-color: var(--accent); color: var(--accent); }
.ct-btn:hover { border-color: rgba(212,175,55,.5); color: rgba(212,175,55,.7); }
.search-bar { display: flex; gap: .5rem; margin-bottom: .9rem; }
.search-bar input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .5rem .8rem; color: var(--text); font-size: .83rem; outline: none; }

.report-area { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; font-size: .82rem; line-height: 1.7; color: var(--text-muted); min-height: 180px; white-space: pre-wrap; font-family: 'Inter', monospace; }

<body>

<div id="onboarding">
  <div class="ob-logo"><span>ST8</span> RESTO</div>
  <div class="ob-sub">Powered by CHEFF · AI Технолог</div>
  <div class="ob-steps">
    <div class="ob-step active" id="st0"></div>
    <div class="ob-step" id="st1"></div>
    <div class="ob-step" id="st2"></div>
  </div>
  <div class="ob-card" id="ob-content"></div>
</div>

<div id="app">
  <header>
    <div class="hd-brand">
      <div class="hd-logo"><span>ST8</span> RESTO</div>
      <div class="hd-venue" id="hd-venue"></div>
    </div>
    <nav class="tab-nav" id="tab-nav"></nav>
    <div class="hd-right">
      <div class="cheff-status">CHEFF онлайн 🟢</div>
      <button class="settings-btn" onclick="openSettings()" title="Настройки">⚙️</button>
    </div>
  </header>
  <div class="content">
    <div class="greeting-card">
      <div class="gc-avatar">🤖</div>
      <div class="gc-text" id="greeting-text">Загрузка...</div>
    </div>
    <div id="tab-panels"></div>
  </div>
</div>

<div class="modal-bg hidden" id="settings-modal">
  <div class="modal">
    <div class="modal-hd">
      <h2>⚙️ Настройки</h2>
      <button class="close-btn" onclick="closeSettings()">✕</button>
    </div>
    <div id="settings-content"></div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.log('SW ошибка:', err));
}

const S = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k,v) => localStorage.setItem(k, JSON.stringify(v)),
  raw: k => localStorage.getItem(k),
  setRaw: (k,v) => localStorage.setItem(k, v),
};

let config = S.get('st8_config') || { name:'', city:'', manager:'', chef:'', cuisine:'', seats:0, avgCheck:0, revenue:0, foodcost:0, crm:'iiko', accentColor:'#d4af37' };
let vertical = S.raw('st8_vertical') || '';
if (config.name === 'Unikfood') { localStorage.clear(); config = { name:'', city:'', manager:'', chef:'', cuisine:'', seats:0, avgCheck:0, revenue:0, foodcost:0, crm:'iiko', accentColor:'#d4af37' }; vertical = ''; }
let mem = S.get('st8_cheff_memory') || { wins:[], fails:[], patterns:[], notes:[], daysActive:0, lastVisit:null };
let chatHistory = S.get('st8_chat') || [];
let analyticsData = S.get('st8_analytics') || [];
let purchases = S.get('st8_purchases') || [];
let inventory = S.get('st8_inventory') || [];
let ttkList = S.get('st8_ttk') || [];
let reviewHistory = S.get('st8_reviews') || [];
let charts = {};
let roiSliders = { tech:90000, hours:2, writeoff:3, rating:3.8 };
let obStep = 1, obVert = '', obForm = {};

const TABS_CFG = {
  RESTO:   [{id:'cheff',icon:'🤖',label:'CHEFF'},{id:'ttk',icon:'📋',label:'ТТК'},{id:'reviews',icon:'💬',label:'Отзывы'},{id:'analytics',icon:'📊',label:'Аналитика'},{id:'purchases',icon:'📦',label:'Закупки'},{id:'inventory',icon:'🔍',label:'Инвентаризация'},{id:'roi',icon:'💰',label:'ROI'},{id:'report',icon:'📤',label:'Отчёт'}],
  BAKERY:  [{id:'cheff',icon:'🤖',label:'CHEFF'},{id:'ttk',icon:'📋',label:'Рецептуры'},{id:'purchases',icon:'📦',label:'Сырьё'},{id:'analytics',icon:'📊',label:'Партии'},{id:'roi',icon:'💰',label:'ROI'},{id:'report',icon:'📤',label:'Отчёт'}],
  DARK:    [{id:'cheff',icon:'🤖',label:'CHEFF'},{id:'ttk',icon:'📋',label:'ТТК'},{id:'reviews',icon:'⭐',label:'Рейтинг'},{id:'analytics',icon:'📊',label:'Агрегаторы'},{id:'purchases',icon:'📦',label:'Закупки'},{id:'roi',icon:'💰',label:'ROI'},{id:'report',icon:'📤',label:'Отчёт'}],
  CORP:    [{id:'cheff',icon:'🤖',label:'CHEFF'},{id:'ttk',icon:'📋',label:'Меню недели'},{id:'analytics',icon:'📊',label:'Нормы питания'},{id:'purchases',icon:'📦',label:'Закупки'},{id:'roi',icon:'💰',label:'ROI'},{id:'report',icon:'📤',label:'Отчёт'}],
  FACTORY: [{id:'cheff',icon:'🤖',label:'CHEFF'},{id:'ttk',icon:'📋',label:'ТТК'},{id:'analytics',icon:'📊',label:'Производство'},{id:'inventory',icon:'🔍',label:'Контроль качества'},{id:'roi',icon:'💰',label:'ROI'},{id:'report',icon:'📤',label:'Отчёт'}],
};

const SCENARIOS_CFG = {
  RESTO:   ['⚡ Чек-лист открытия','⚡ Анализ медленных позиций','⚡ Upsell скрипт','⚡ Мотивация команды','⚡ Температурный журнал'],
  BAKERY:  ['⚡ Партия на день','⚡ Оптимизация рецептуры','⚡ Работа с остатками','⚡ Сезонный ассортимент'],
  DARK:    ['⚡ Поднять рейтинг','⚡ Оптимизировать сборку','⚡ Анализ отмен','⚡ Ответ на отзыв'],
  CORP:    ['⚡ Меню на неделю','⚡ Расчёт КБЖУ','⚡ Снизить себестоимость','⚡ Ротация меню'],
  FACTORY: ['⚡ Производственный план','⚡ Расчёт потерь','⚡ ХАССП чек-лист'],
};

function init() {
  if (S.raw('st8_config') && vertical) {
    applyAccent();
    updateDaysActive();
    showApp();
  } else {
    renderOB();
  }
}

function applyAccent() {
  document.documentElement.style.setProperty('--accent', config.accentColor || '#d4af37');
}

function updateDaysActive() {
  const today = new Date().toDateString();
  if (mem.lastVisit !== today) {
    mem.daysActive = (mem.daysActive || 0) + 1;
    mem.lastVisit = today;
    S.set('st8_cheff_memory', mem);
  }
}

const VERTS_LIST = [
  {id:'RESTO',  icon:'🍽️', name:'Ресторан / кафе',          sub:'Полный сервис, доставка, бар'},
  {id:'BAKERY', icon:'🥐', name:'Пекарня / кондитерская',    sub:'Производство выпечки'},
  {id:'DARK',   icon:'📦', name:'Dark Kitchen / доставка',   sub:'Только доставка, агрегаторы'},
  {id:'CORP',   icon:'🏢', name:'Корпоративное питание',     sub:'Офисы, предприятия, соцпит'},
  {id:'FACTORY',icon:'🏭', name:'Производство / заготовочный',sub:'Цеха, фабрики-кухни'},
];

function renderOB() {
  const el = document.getElementById('ob-content');
  document.querySelectorAll('.ob-step').forEach((s,i) => s.classList.toggle('active', i < obStep));
  if (obStep === 1) {
    el.innerHTML = `<div class="ob-title">Тип заведения</div><div class="ob-desc">CHEFF настроит систему под вашу специализацию</div><div class="vert-grid">${VERTS_LIST.map(v=>`<div class="vert-card${obVert===v.id?' selected':''}" onclick="obSelectVert('${v.id}')"><div class="vc-icon">${v.icon}</div><div class="vc-name">${v.name}</div><div class="vc-sub">${v.sub}</div></div>`).join('')}</div><div class="ob-nav"><div></div><button class="btn btn-accent" onclick="obNext()">Далее →</button></div>`;
  } else if (obStep === 2) {
    el.innerHTML = `<div class="ob-title">Данные заведения</div><div class="ob-desc">Чем больше данных — тем точнее советы CHEFF</div><div class="form-grid"><div class="field"><label>Название *</label><input id="f-name" placeholder="Моё кафе" value="${obForm.name||''}"></div><div class="field"><label>Город *</label><input id="f-city" placeholder="Москва" value="${obForm.city||''}"></div><div class="field"><label>Управляющий *</label><input id="f-mgr" placeholder="Иван Иванов" value="${obForm.manager||''}"></div><div class="field"><label>Шеф / технолог</label><input id="f-chef" placeholder="Пётр Петров" value="${obForm.chef||''}"></div><div class="field field-full"><label>Тип кухни / специализация</label><input id="f-cuis" placeholder="Европейская, итальянская..." value="${obForm.cuisine||''}"></div><div class="field"><label>Кол-во мест</label><input id="f-seats" type="number" placeholder="80" value="${obForm.seats||''}"></div><div class="field"><label>Средний чек ₽</label><input id="f-check" type="number" placeholder="1200" value="${obForm.avgCheck||''}"></div><div class="field"><label>Выручка млн/мес</label><input id="f-rev" type="number" step="0.1" placeholder="2.5" value="${obForm.revenue||''}"></div><div class="field"><label>Фудкост %</label><input id="f-fc" type="number" placeholder="28" value="${obForm.foodcost||''}"></div><div class="field"><label>Учётная система</label><select id="f-crm">${['iiko','R-Keeper','1С','Excel','Без системы'].map(c=>`<option${(obForm.crm||'iiko')===c?' selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Цвет акцента</label><input id="f-color" type="color" value="${obForm.accentColor||'#d4af37'}"></div><div class="field field-full"><label>Anthropic API ключ</label><input id="f-key" type="password" placeholder="sk-ant-api03-..." value="${S.raw('st8_api_key')||''}"></div></div><div class="ob-nav"><button class="btn btn-ghost" onclick="obBack()">← Назад</button><button class="btn btn-accent" onclick="obNext()">Далее →</button></div>`;
  } else if (obStep === 3) {
    el.innerHTML = `<div class="ob-title">Готово!</div><div class="ob-desc">CHEFF настроен и готов работать</div><div class="crm-panel" style="text-align:center;"><div class="cpt" style="margin-bottom:1rem">✅ Система настроена</div><p class="text-muted text-sm">Все данные сохранены. CHEFF начнёт работать сразу после запуска.</p></div><div class="ob-nav"><button class="btn btn-ghost" onclick="obBack()">← Назад</button><button class="btn btn-accent" onclick="obFinish()">🚀 Запустить CHEFF</button></div>`;
  }
}

function obSelectVert(id) { obVert = id; renderOB(); }
function obBack() { obStep--; renderOB(); }
function obNext() {
  if (obStep===1) {
    if (!obVert) { alert('Выберите тип заведения'); return; }
    obStep=2;
  } else if (obStep===2) {
    const name = document.getElementById('f-name').value.trim();
    const city = document.getElementById('f-city').value.trim();
    const mgr = document.getElementById('f-mgr').value.trim();
    if (!name||!city||!mgr) { alert('Заполните Название, Город и Управляющего'); return; }
    obForm = { name, city, manager:mgr, chef:document.getElementById('f-chef').value, cuisine:document.getElementById('f-cuis').value, seats:+document.getElementById('f-seats').value||0, avgCheck:+document.getElementById('f-check').value||0, revenue:+document.getElementById('f-rev').value||0, foodcost:+document.getElementById('f-fc').value||0, crm:document.getElementById('f-crm').value, accentColor:document.getElementById('f-color').value };
    const key = document.getElementById('f-key').value.trim();
    if (key) S.setRaw('st8_api_key', key);
    obStep=3;
  }
  renderOB();
}
function obFinish() {
  config = {...obForm};
  vertical = obVert;
  mem = { wins:[], fails:[], patterns:[], notes:[], daysActive:1, lastVisit:new Date().toDateString() };
  S.set('st8_config', config);
  S.setRaw('st8_vertical', vertical);
  S.set('st8_cheff_memory', mem);
  document.getElementById('onboarding').style.display='none';
  applyAccent();
  showApp();
}

function showApp() {
  document.getElementById('onboarding').style.display='none';
  const app = document.getElementById('app');
  app.style.display='flex';
  document.getElementById('hd-venue').textContent = config.name||'';
  buildGreeting();
  buildTabs();
  buildPanels();
  switchTab('cheff');
}

function buildGreeting() {
  const d=new Date(), day=d.getDay(), h=d.getHours();
  const days=['воскресенье','понедельник','вторник','среду','четверг','пятницу','субботу'];
  let tip = 'Готов помочь — задай вопрос или выбери сценарий ниже.';
  const fname = (config.manager||'Управляющий').split(' ')[0];
  document.getElementById('greeting-text').innerHTML = `<strong>Привет, ${fname}!</strong> Я CHEFF. Сегодня ${days[day]}. ${tip}`;
}

function buildTabs() {
  const tabs = TABS_CFG[vertical]||TABS_CFG.RESTO;
  document.getElementById('tab-nav').innerHTML = tabs.map(t=>
    `<button class="tab-btn" id="tb-${t.id}" onclick="switchTab('${t.id}')"><span class="ti">${t.icon}</span><span class="tl">${t.label}</span></button>`
  ).join('');
}

function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById(`tb-${id}`);
  if(btn) btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const panel=document.getElementById(`panel-${id}`);
  if(panel) panel.classList.add('active');
}

function buildPanels() {
  const tabs = TABS_CFG[vertical]||TABS_CFG.RESTO;
  document.getElementById('tab-panels').innerHTML = tabs.map(t=>`<div class="tab-panel" id="panel-${t.id}"><div class="card"><p class="text-muted">ST8 RESTO установлена как PWA!</p><p class="text-muted text-sm" style="margin-top:.5rem">Раздел "${t.label}" готов к использованию</p></div></div>`).join('');
}

function openSettings(){
  document.getElementById('settings-content').innerHTML=`
    <div class="form-grid">
      <div class="field"><label>Название</label><input id="s-n" value="${config.name}"></div>
      <div class="field"><label>Город</label><input id="s-c" value="${config.city}"></div>
      <div class="field"><label>Управляющий</label><input id="s-m" value="${config.manager}"></div>
      <div class="field"><label>Выручка млн/мес</label><input id="s-r" type="number" step="0.1" value="${config.revenue}"></div>
      <div class="field"><label>Цвет акцента</label><input id="s-col" type="color" value="${config.accentColor||'#d4af37'}"></div>
      <div class="field field-full"><label>API ключ Anthropic</label><input id="s-k" type="password" placeholder="sk-ant-..." value="${S.raw('st8_api_key')||''}"></div>
    </div>
    <div class="gap-sm mt-sm"><button class="btn btn-accent" onclick="saveSettings()">💾 Сохранить</button><button class="btn btn-danger" onclick="resetAll()">🔄 Сбросить</button></div>`;
  document.getElementById('settings-modal').classList.remove('hidden');
}
function closeSettings(){ document.getElementById('settings-modal').classList.add('hidden'); }
function saveSettings(){
  config.name=document.getElementById('s-n').value;
  config.city=document.getElementById('s-c').value;
  config.manager=document.getElementById('s-m').value;
  config.revenue=+document.getElementById('s-r').value||0;
  config.accentColor=document.getElementById('s-col').value;
  const k=document.getElementById('s-k').value.trim(); if(k) S.setRaw('st8_api_key',k);
  S.set('st8_config',config);
  applyAccent();
  document.getElementById('hd-venue').textContent=config.name;
  closeSettings();
  alert('✅ Сохранено');
}
function resetAll(){ if(!confirm('Сбросить ВСЕ данные?'))return; localStorage.clear(); location.reload(); }

// ══ ЭКСПОРТ / ИМПОРТ ДАННЫХ ══
function exportData() {
  const keys = ['st8_config','st8_vertical','st8_cheff_memory','st8_chat','st8_analytics','st8_purchases','st8_inventory','st8_ttk','st8_reviews'];
  const data = { app: 'ST8 RESTO', version: '1.0', date: new Date().toISOString(), data: {} };
  keys.forEach(k => { const v = localStorage.getItem(k); if(v) data.data[k] = v; });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'st8-resto-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const backup = JSON.parse(ev.target.result);
        if (!backup.data) throw new Error('Неверный формат');
        if (!confirm(`Восстановить данные ST8 RESTO от ${backup.date?.slice(0,10) || '?'}?\nТекущие данные будут заменены!`)) return;
        Object.entries(backup.data).forEach(([k, v]) => localStorage.setItem(k, v));
        alert('✅ Данные восстановлены!');
        location.reload();
      } catch(err) {
        alert('❌ Ошибка: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

init();
</script>

<!-- КНОПКИ ДАННЫХ -->

  <button onclick="importData()" style="padding:0.5rem 0.8rem;background:#1a1a1a;border:1px solid rgba(212,175,55,0.4);color:#d4af37;border-radius:8px;cursor:pointer;font-size:0.8rem;font-weight:600;" title="Восстановить из файла">📂 Загрузить</button>
</div>
